# ============================================================================
#  Shorts Factory - configuration
# ============================================================================
channel:
  name: "Dokumenter Visual"
  hashtags: ["#Shorts", "#Teknologi", "#FaktaTeknologi", "#Sains"]
  description_footer: >-
    Narasi dibuat dengan bantuan AI dan suara sintetis; setiap fakta dirangkum dari sumber di atas.
    Animasi 3D dibuat otomatis dengan Blender.

llm:
  # Fallback order. gemini-2.5-* is only served to keys that used it before (Google deprecations page, 2026-10-22),
  # so a new key may get 404 there; 404/403 models are skipped automatically. Verify free-tier access of 3.x in AI Studio.
  models: ["gemini-3.8-flash", "gemini-3.1-flash-lite", "gemini-2.5-flash", "gemini-2.5-flash-lite"]

selection:
  max_age_days: 6            # only articles newer than this
  min_article_chars: 1800    # skip paywalled / thin pages
  max_facts: 5
  min_verified_facts: 3      # fewer than this -> try the next article
  min_evidence_match: 94     # fuzzy match % of the evidence quote inside the article
  llm_judge: true            # second LLM pass that checks claim <-> evidence
  max_articles_to_try: 6
  prefer_indonesia: true     # rank Indonesia-relevant candidates first (feed region: id, or explicit mention / local-impact topic)

script:
  min_scenes: 10
  max_scenes: 12
  hook_words: [18, 26]
  fact_words: [25, 38]
  kicker_words: [18, 28]
  total_words: [300, 390]
  label_max: 28
  title_max: 80
  max_attempts: 5
  analysis: true                # scene right before the closing = labelled ANALYSIS (opinion): no numbers, no new names
  analysis_words: [18, 28]
  analysis_allowed_names: ["Indonesia", "Asia", "Tenggara", "ASEAN", "Analisis"]

tts:
  voice: "id-ID-ArdiNeural"       # alternatif: id-ID-GadisNeural
  rate: "+8%"
  pitch: "+0Hz"
  pronunciation:                  # dipakai hanya untuk suara (teks layar tetap asli)
    AI: "A I"
    GPU: "G P U"
    CPU: "C P U"
    NPU: "N P U"
    LLM: "L L M"
    USB: "U S B"
    nm: "nanometer"
    TOPS: "tops"
    RI: "R I"
    OJK: "O J K"
    IKN: "I K N"
    QRIS: "kris"
    UMKM: "U M K M"
    EV: "E V"
    5G: "lima G"

video:
  width: 1080
  height: 1920
  fps: 30
  min_seconds: 120              # target documentary runtime: 2-3 minutes
  max_seconds: 180
  first_scene_lead: 0.15
  scene_lead: 0.22
  scene_tail: 0.30
  last_tail: 0.9
  transition: 0.35
  crf: 18
  preset: medium

render3d:
  mode: still                   # hybrid 2.5D = one 3D still per scene + animated 2D graphics
                                # video = full 3D animation per frame (slow, ~1 h)
  profile: fast                 # fast | balanced | high; use low-cost still renders
  stills:                       # still-mode render size / samples per profile (time per still = ESTIMATE, not measured)
    fast:     { width: 540,  height: 960,  samples: 24 }
    balanced: { width: 720,  height: 1280, samples: 40 }
    high:     { width: 1080, height: 1920, samples: 64 }
  profiles:                     # estimates on a 4-core GitHub runner, see README
    fast:     { width: 432, height: 768,  samples: 12, fps: 12 }   # ~25 min
    balanced: { width: 540, height: 960,  samples: 14, fps: 12 }   # ~45 min
    high:     { width: 720, height: 1280, samples: 24, fps: 15 }   # ~2 h
  motion_blur: false            # +~70% render time; looks smoother at low fps
  interpolation: mci            # dup | blend | mci  (12 -> 30 fps motion interpolation)  (frame-rate up-conversion to 30 fps)
  shift_y: -0.16
  camera_moves: ["push", "orbit", "pull"]
  visual_style: "documentary_blueprint"
  background_grid: true
  isometric_camera: true

subtitles:
  label_pill: false          # still mode draws the label as big text; set true for the old top pill
  font_bold: "Poppins ExtraBold"
  font_semibold: "Poppins SemiBold"
  caption_size: 80
  caption_y: 1500
  max_line_chars: 17
  label_size: 58
  label_y: 235
  label_upper: true
  source_size: 44
  card_title_size: 70
  card_body_size: 42
  card_y: 1130

audio:
  music: true                   # uses any file in assets/music/ (optional, royalty-free only!)
  music_volume: 0.10
  whoosh: true
  lufs: -14

upload:
  privacy: public               # public | unlisted | private
  category_id: "28"             # Science & Technology
  made_for_kids: false
  contains_synthetic_media: null   # set true/false to send the "altered or synthetic content" flag; null = omit

# Trusted sources. tier 1 = primary (universities, agencies, research), 2 = reputable tech press, 3 = other.
feeds:
  - { name: "MIT News",                 url: "https://news.mit.edu/rss/feed",                                            tier: 1 }
  - { name: "NASA",                     url: "https://www.nasa.gov/feed/",                                               tier: 1 }
  - { name: "IEEE Spectrum",            url: "https://spectrum.ieee.org/feeds/feed.rss",                                 tier: 1 }
  - { name: "ScienceDaily",             url: "https://www.sciencedaily.com/rss/top/technology.xml",                      tier: 1 }
  - { name: "ScienceDaily (AI)",        url: "https://www.sciencedaily.com/rss/computers_math/artificial_intelligence.xml", tier: 1 }
  - { name: "Phys.org",                 url: "https://phys.org/rss-feed/technology-news/",                               tier: 2 }
  - { name: "MIT Technology Review",    url: "https://www.technologyreview.com/feed/",                                   tier: 2 }
  - { name: "Ars Technica",             url: "https://arstechnica.com/feed/",                                            tier: 2 }
  - { name: "Google Research",          url: "https://research.google/blog/rss/",                                        tier: 2 }
  - { name: "Google DeepMind",          url: "https://deepmind.google/blog/rss.xml",                                     tier: 2 }
  - { name: "The Verge",                url: "https://www.theverge.com/rss/index.xml",                                   tier: 3 }
  # --- Indonesian / regional sources (region: id). URLs are UNVERIFIED guesses from memory: a feed that fails is
  # skipped with a warning in the log; fix or delete lines accordingly. ---
  - { name: "The Conversation Indonesia", url: "https://theconversation.com/id/articles.atom",        tier: 1, region: id }
  - { name: "ANTARA",                     url: "https://www.antaranews.com/rss/tekno.xml",             tier: 2, region: id }
  - { name: "detikInet",                  url: "https://rss.detik.com/index.php/inet",                 tier: 2, region: id }
  - { name: "CNBC Indonesia",             url: "https://www.cnbcindonesia.com/tech/rss",               tier: 2, region: id }
  - { name: "Tempo",                      url: "https://rss.tempo.co/tekno",                           tier: 2, region: id }
  - { name: "DailySocial",                url: "https://dailysocial.id/feed",                          tier: 3, region: id }
  - { name: "Rest of World",              url: "https://restofworld.org/feed/",                        tier: 2 }
